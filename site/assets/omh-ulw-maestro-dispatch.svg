<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="524" viewBox="0 0 1100 524" role="img" aria-label="Illustration: ulw-maestro dispatching one unit to Claude Code and one to Codex, with both dock rows in the OMH HUD"><rect width="1100" height="524" rx="0" fill="#0b0f14"/><line x1="20" y1="374" x2="1080" y2="374" stroke="#5fd4e0" stroke-opacity="0.45" stroke-width="1"/><text x="28" y="402" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14"><tspan fill="#5fd4e0">❯ </tspan><tspan fill="#f4f6f8">▌</tspan></text><line x1="20" y1="420" x2="1080" y2="420" stroke="#5fd4e0" stroke-opacity="0.45" stroke-width="1"/><rect x="8" y="456" width="3" height="19" rx="1.5" fill="#D97757"/><rect x="8" y="479" width="3" height="19" rx="1.5" fill="#9CA3AF"/><circle cx="888" cy="18" r="5" fill="#D97757"/><text x="898" y="22" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#D97757">Claude Code</text><circle cx="1000" cy="18" r="5" fill="#9CA3AF"/><text x="1010" y="22" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9CA3AF">Codex</text><text x="28" y="45" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">ulw-maestro: send the retry-queue fix to Claude Code and the lint cleanup to Codex, dispatch both now</tspan></text><text x="28" y="68" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">owners named for this run: </tspan><tspan fill="#D97757">claude-code</tspan><tspan fill="#c5ccd6"> → retry-queue, </tspan><tspan fill="#9CA3AF">codex</tspan><tspan fill="#c5ccd6"> → lint-cleanup</tspan></text><text x="28" y="91" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">prompts composed from each CLI's own installed skills · readiness observed · permission probe passed</tspan></text><text x="28" y="114" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">└ ▾ Tool calls (4)</tspan></text><text x="28" y="137" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">terminal("omh coding executor-skills --profile </tspan><tspan fill="#D97757">claude-code</tspan><tspan fill="#c5ccd6">")</tspan><tspan fill="#6b7683"> (0.6s)</tspan></text><text x="28" y="160" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">terminal("omh coding executor-skills --profile </tspan><tspan fill="#9CA3AF">codex</tspan><tspan fill="#c5ccd6">")</tspan><tspan fill="#6b7683"> (0.4s)</tspan></text><text x="28" y="183" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">terminal("omh coding fanout dispatch fanout-retry-lint --goal-file goal.md")</tspan><tspan fill="#6b7683"> (1.2s)</tspan></text><text x="28" y="206" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  └ ● </tspan><tspan fill="#c5ccd6">terminal("omh coding fanout status --fanout-id fanout-retry-lint --json")</tspan><tspan fill="#6b7683"> (0.2s)</tspan></text><text x="28" y="252" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">   unit          owner        resume handle                  state</tspan></text><text x="28" y="275" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">   retry-queue   </tspan><tspan fill="#D97757">claude-code</tspan><tspan fill="#c5ccd6">  session_id 4f1c9e02-7b3a-…     </tspan><tspan fill="#63d47f">running</tspan></text><text x="28" y="298" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">   lint-cleanup  </tspan><tspan fill="#9CA3AF">codex      </tspan><tspan fill="#c5ccd6">  thread_id  019a7d31-c2e8-…     </tspan><tspan fill="#63d47f">running</tspan></text><text x="28" y="344" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">   Dispatched, not merged. Each unit reports back with its own evidence; merging stays your call.</tspan></text><text x="20" y="448" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">⚚ [OMH]</tspan><tspan fill="#6b7683"> v3.0.0 │ </tspan><tspan fill="#c5ccd6">2 agents · </tspan><tspan fill="#e0b455">2 running</tspan><tspan fill="#6b7683"> · $0.38 · ctx --</tspan></text><text x="20" y="471" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#D97757">▸ </tspan><tspan fill="#c5ccd6">retry-queue   Fix retry backoff and dead-letter handoff   · </tspan><tspan fill="#D97757">(claude/maestro opus)</tspan><tspan fill="#6b7683">        · turn 6 · $0.31 · </tspan><tspan fill="#63d47f">running</tspan><tspan fill="#6b7683"> · 3m</tspan></text><text x="20" y="494" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#9CA3AF">▸ </tspan><tspan fill="#c5ccd6">lint-cleanup  Clear lint warnings in src/billing         · </tspan><tspan fill="#9CA3AF">(codex/maestro gpt-5.6-sol)</tspan><tspan fill="#6b7683">  · turn 3 · $0.07 · </tspan><tspan fill="#63d47f">running</tspan><tspan fill="#6b7683"> · 2m</tspan></text></svg>
